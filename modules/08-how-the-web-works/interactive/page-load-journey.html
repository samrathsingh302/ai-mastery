<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The page-load journey — your site, hop by hop (module 08)</title>
<style>
  :root{ --bg:#f6f7fb; --card:#fff; --ink:#1c2130; --muted:#5b6478; --line:#dfe3ee;
    --accent:#2f6df6; --accent-ink:#fff; --chip:#eef2ff; --hl:#fff3c4; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12141c; --card:#1b1f2b; --ink:#e8ebf4; --muted:#9aa3b8; --line:#2c3245;
      --accent:#6d9bff; --accent-ink:#0d1322; --chip:#232a3d; --hl:#4a4420; } }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:1.2rem}
  .wrap{max-width:760px; margin:0 auto}
  h1{font-size:1.3rem; margin:.2rem 0} .sub{color:var(--muted); font-size:.9rem; margin:0 0 1rem}
  .card{background:var(--card); border:1px solid var(--line); border-radius:.8rem;
    padding:.9rem 1rem; margin-bottom:.8rem}
  .rail{display:flex; flex-wrap:wrap; gap:.35rem; margin-bottom:.8rem}
  .rail span{padding:.35rem .6rem; border-radius:1rem; background:var(--chip); font-size:.82rem;
    opacity:.45}
  .rail span.seen{opacity:.8} .rail span.now{opacity:1; background:var(--accent); color:var(--accent-ink); font-weight:600}
  h2{font-size:1.05rem; margin:.2rem 0 .4rem}
  .evi{font:12.5px/1.6 ui-monospace,Consolas,monospace; background:var(--chip);
    border-radius:.5rem; padding:.6rem .8rem; white-space:pre-wrap; word-break:break-word; margin:.5rem 0}
  .why{font-size:.94rem}
  .controls{display:flex; gap:.5rem; margin-top:.7rem; align-items:center}
  button{padding:.5rem 1rem; border:0; border-radius:.6rem; background:var(--accent);
    color:var(--accent-ink); font-weight:600; cursor:pointer; font-size:.95rem}
  button.ghost{background:var(--chip); color:var(--ink)}
  button:disabled{opacity:.4; cursor:default}
  .step{color:var(--muted); font-size:.9rem; margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>The page-load journey</h1>
  <p class="sub">One request to YOUR live site, hop by hop — every evidence block was captured
  from the real wire on 04/08/2026. Predict each next hop before stepping.</p>
  <div class="card">
    <div class="rail" id="rail"></div>
    <h2 id="t"></h2>
    <div class="evi" id="evi"></div>
    <div class="why" id="why"></div>
    <div class="controls">
      <button class="ghost" onclick="si=0;render()">⟲ Restart</button>
      <button id="b" onclick="if(si<H.length-1){si++;render()}">▶ Next</button>
      <span class="step" id="n"></span>
    </div>
  </div>
</div>
<script>
"use strict";
const H = [
 ["URL","https://www.leedspunjabisociety.com/dashboard",
  "Scheme (https) says WHICH protocol · host says WHICH machine by name · path says WHICH thing there. Nothing has touched the network yet — this is just an instruction, waiting."],
 ["DNS","nslookup www.leedspunjabisociety.com\n→ 172.67.183.218 · 104.21.18.225\n→ 2606:4700:3034::ac43:b7da (+1 more IPv6)",
  "The phone book: name → numeric addresses. These ranges belong to CLOUDFLARE — the name points at a protective edge, not the origin. (The old vercel.app name resolves to completely different, Vercel-owned addresses: same app, two doors.)"],
 ["TCP","connect 172.67.183.218 : port 443\nConnection: keep-alive",
  "A reliable two-way pipe is opened to door 443 — the phone call is placed. keep-alive in the response means the call stays open for the NEXT request instead of redialling."],
 ["TLS","Strict-Transport-Security: max-age=63072000;\n  includeSubDomains; preload",
  "The call goes secret: encryption (nobody between can read/alter) + a certificate (proof you reached the real site). The HSTS header commits browsers to HTTPS-only for two years — http:// is dead here."],
 ["REQUEST","GET /dashboard HTTP/1.1\nHost: www.leedspunjabisociety.com\n(no session cookie — you're logged out)",
  "The conversation: method + path + headers. The crucial ABSENCE: no session cookie rides along, because you've never logged in on this client."],
 ["EDGE","Age: 6282        (on /)\nReport-To: cf-nel …cloudflare.com…",
  "Cloudflare's shelf answers what it can: the public landing page came FROM CACHE (it had sat there 6282 seconds — the origin slept). A logged-out /dashboard can't be served from a shelf — it must go through to the gate…"],
 ["GATE","HTTP/1.1 307 Temporary Redirect\nLocation: …/login        (0.17s)",
  "app/src/proxy.ts — the 31 lines you read in module 06 — sees no session and bounces you BEFORE any page code runs. 307 = temporary: log in, and /dashboard serves normally again. This is the wire-side view of the code-side fact."],
 ["RESPONSE","HTTP/1.1 200 OK   (after login, or on /)\nContent-Type: text/html; charset=utf-8\nX-Frame-Options: DENY\ncontent-security-policy-report-only: …*.supabase.co…",
  "Status family 2xx = worked. The headers narrate the house rules: nobody may iframe this site; the page may only talk to itself and Supabase (in report-only rehearsal). One response, and you know the backend."],
 ["RENDER","<!doctype html><html>…\n→ browser parses → more requests (css/js/img)\n→ each repeats THIS ENTIRE JOURNEY",
  "The browser turns HTML into pixels and discovers it needs more files — every one re-runs URL→DNS(cached)→TCP(kept alive)→TLS(resumed)→HTTP. The journey isn't a one-off; it's the web's heartbeat, dozens of times per page."],
];
let si=0;
const $=id=>document.getElementById(id);
function render(){
  $("rail").innerHTML=H.map((h,i)=>
    `<span class="${i<si?"seen":i===si?"now":""}">${h[0]}</span>`).join("");
  $("t").textContent=`${si+1} · ${H[si][0]}`;
  $("evi").textContent=H[si][1];
  $("why").textContent=H[si][2];
  $("n").textContent=`hop ${si+1} / ${H.length}`;
  $("b").disabled = si>=H.length-1;
}
render();
</script>
</body>
</html>
