<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How ChatGPT is made — pipeline explorer + quiz (module 01)</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --ink:#1c2130; --muted:#5b6478; --line:#dfe3ee;
    --accent:#2f6df6; --accent-ink:#ffffff; --good:#188554; --bad:#c23838; --warn:#8a6d1a;
    --chip:#eef2ff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12141c; --card:#1b1f2b; --ink:#e8ebf4; --muted:#9aa3b8; --line:#2c3245;
      --accent:#6d9bff; --accent-ink:#0d1322; --good:#4ecb8d; --bad:#ff7b7b; --warn:#e6c65c;
      --chip:#232a3d;
    }
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg); color:var(--ink);
    font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:1.2rem}
  .wrap{max-width:880px; margin:0 auto}
  h1{font-size:1.35rem; margin:.2rem 0 .3rem}
  .sub{color:var(--muted); margin:0 0 1rem; font-size:.95rem}
  .tabs{display:flex; gap:.5rem; margin-bottom:1rem}
  .tabs button{flex:1; padding:.6rem .8rem; border:1px solid var(--line); background:var(--card);
    color:var(--ink); border-radius:.6rem; font-size:1rem; cursor:pointer}
  .tabs button.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
  .card{background:var(--card); border:1px solid var(--line); border-radius:.8rem; padding:1rem 1.1rem; margin-bottom:.8rem}
  /* pipeline */
  .pipe{display:flex; flex-wrap:wrap; gap:.5rem; margin:.6rem 0 1rem}
  .stage{flex:1 1 150px; text-align:center; padding:.7rem .5rem; border:2px solid var(--line);
    border-radius:.7rem; cursor:pointer; background:var(--card); color:var(--ink); font-size:.95rem}
  .stage small{display:block; color:var(--muted)}
  .stage.on{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)}
  .lbl{display:inline-block; background:var(--chip); border-radius:.4rem; padding:.05rem .5rem;
    font-size:.8rem; color:var(--muted); margin-right:.4rem}
  .stagebody h2{font-size:1.1rem; margin:.1rem 0 .4rem}
  .stagebody p{margin:.45rem 0}
  /* quiz */
  .qmeta{display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; margin-bottom:.4rem}
  .tier{font-weight:600}
  .tier.t1{color:var(--good)} .tier.t2{color:var(--warn)} .tier.t3{color:var(--bad)}
  .q{font-size:1.05rem; font-weight:600; margin:.2rem 0 .8rem}
  .opts{display:grid; gap:.5rem}
  .opts button{text-align:left; padding:.6rem .8rem; border:1px solid var(--line); background:var(--bg);
    color:var(--ink); border-radius:.6rem; font-size:.97rem; cursor:pointer}
  .opts button:disabled{cursor:default; opacity:.85}
  .opts button.right{border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good)}
  .opts button.wrong{border-color:var(--bad); box-shadow:inset 0 0 0 1px var(--bad)}
  .explain{margin-top:.8rem; padding:.7rem .9rem; border-left:3px solid var(--accent);
    background:var(--chip); border-radius:.4rem; font-size:.95rem}
  .nav{margin-top:.9rem; display:flex; justify-content:flex-end}
  .nav button, .restart{padding:.55rem 1.1rem; border:0; background:var(--accent); color:var(--accent-ink);
    border-radius:.6rem; font-size:1rem; cursor:pointer; font-weight:600}
  .bar{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:1rem}
  .bar div{height:100%; background:var(--accent); width:0; transition:width .3s}
  .score{font-size:1.2rem; font-weight:700; margin:.3rem 0}
  .review li{margin:.3rem 0}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>How ChatGPT is made</h1>
  <p class="sub">Companion interactive for module 01 · works offline · click everything</p>
  <div class="tabs">
    <button id="tabP" class="on" onclick="tab('P')">Pipeline explorer</button>
    <button id="tabQ" onclick="tab('Q')">Quiz (gets harder)</button>
  </div>

  <div id="paneP">
    <div class="card">
      <div class="pipe" id="pipe"></div>
      <div class="stagebody" id="stagebody"></div>
    </div>
  </div>

  <div id="paneQ" class="hide">
    <div class="card">
      <div class="bar"><div id="qbar"></div></div>
      <div id="qhost"></div>
    </div>
  </div>
</div>
<script>
"use strict";
/* ---------- pipeline ---------- */
const STAGES = [
 {t:"🌐 Internet text", s:"~44TB filtered", body:[
  ["What happens","A huge slice of the web (e.g. the FineWeb dataset) is downloaded and filtered: spam, duplicates, adult content and personal data out; trillions of words of books, articles, forums and code stay. Then it's <b>tokenised</b> — cut into chunks (tokens), each mapped to an ID number. Tokens, not letters, are the model's alphabet."],
  ["Analogy","LEGO-ifying the internet: everything becomes standard bricks the machine can build with."],
  ["What can go wrong here","Whatever is common in the data becomes 'likely'. And because letters vanish inside tokens, the finished model will be shaky at spelling and counting letters — the strawberry-r's failure is born at this stage."]]},
 {t:"⚙️ Pretraining", s:"→ base model", body:[
  ["What happens","The model plays 'guess the next token' across the whole dataset, trillions of times. Each wrong guess nudges its billions of <b>parameters</b> (learned dials) a tiny step downhill (gradient descent). Months of GPU time, millions of pounds. Out comes a <b>base model</b>: an internet-document simulator that continues any text in the statistically likely way."],
  ["Analogy","Tuning a mixing desk with a billion sliders by feel until the output 'sounds like the internet'. The parameters end up as a lossy zip of the web — famous text near-exactly, everything else as vague recollection."],
  ["What can go wrong here","Vague recollection is the seed of hallucination. Also: the base model doesn't answer questions — asked one, it may just continue with more questions, because that's what the internet often does."]]},
 {t:"🧑‍🏫 SFT", s:"→ assistant", body:[
  ["What happens","<b>Supervised fine-tuning</b>: human labellers write ideal conversations ('here's a question; here's the perfect helpful answer, per guidelines'), and the model is trained to imitate them. Special tokens mark who's speaking. Now it answers instead of continuing."],
  ["Analogy","A classically-trained chef doing a bootcamp in one restaurant's house style. When you chat with the result, you're talking to a <i>simulation of the ideal labeller</i>."],
  ["What can go wrong here","Hallucination crystallises here: confident-answer <i>style</i> gets applied even where the weights hold only fuzz — likelihood fills the gap. Patches: train 'I don't know' on probed blind spots; give it tools so real sources land in the context window (open book beats memory)."]]},
 {t:"🎯 RL / RLHF", s:"→ reasoning + polish", body:[
  ["What happens","<b>Reinforcement learning</b>: the model tries many solutions; the ones reaching automatically-checkable right answers (maths, code) get reinforced — it discovers its own chains of thought (DeepSeek-R1's 'aha' moments). For uncheckable things (prose, helpfulness), <b>RLHF</b>: humans compare outputs, a <i>reward model</i> learns their preferences, the model is optimised to please it — briefly."],
  ["Analogy","Learning to ride a bike (nobody can tell you the balance — you wobble and keep what works) + AlphaGo's move 37 (optimising the real goal can beat imitating experts)."],
  ["What can go wrong here","The reward model is a gameable simulation of preference: over-optimise and you get junk it loves and humans hate. And 'trained to be preferred' is the mechanical root of sycophancy — agreeing with you scores well. Preferred ≠ true."]]},
];
const pipe = document.getElementById("pipe"), sbody = document.getElementById("stagebody");
STAGES.forEach((st,i)=>{
  const b=document.createElement("button"); b.className="stage"; b.innerHTML=`${st.t}<small>${st.s}</small>`;
  b.onclick=()=>showStage(i); pipe.appendChild(b);
});
function showStage(i){
  [...pipe.children].forEach((b,j)=>b.classList.toggle("on", i===j));
  sbody.innerHTML = `<h2>${STAGES[i].t} <span class="lbl">${STAGES[i].s}</span></h2>` +
    STAGES[i].body.map(([h,p])=>`<p><b>${h}.</b> ${p}</p>`).join("");
}
showStage(0);

/* ---------- quiz ---------- */
const QS = [
 // tier 1 — warm-up
 {t:1,q:"An LLM's one basic trick is…",o:["Looking answers up in a stored database","Predicting the next token of text","Running logical rules written by programmers","Searching the live internet"],a:1,
  x:"Everything else (chatting, coding, 'reasoning') is built on next-token prediction over learned parameters. No database, no rulebook."},
 {t:1,q:"A token is…",o:["Always exactly one word","One letter","A chunk of text mapped to an ID number","A unit of GPU time"],a:2,
  x:"Words, part-words or punctuation become ID'd chunks — the model's LEGO bricks. It never sees letters."},
 {t:1,q:"Training vs inference:",o:["Training tunes the parameters; inference uses them to generate","They're the same thing at different speeds","Inference is how models learn from your chats","Training happens every time you send a message"],a:0,
  x:"Training = slow, expensive tuning. Inference = every chat. Your conversations don't retrain the model mid-chat."},
 {t:1,q:"What comes straight out of pretraining?",o:["A helpful assistant","An internet-document simulator (base model)","A reasoning model","A search engine"],a:1,
  x:"The base model continues text; 'answering' is installed later by SFT."},
 // tier 2 — mechanisms
 {t:2,q:"Why do models hallucinate?",o:["They're trained to maximise engagement","Confident-answer style meets vague recollection — likelihood fills the gap","They copy false websites verbatim","Random hardware errors"],a:1,
  x:"SFT installs the confident style; the lossy-zip weights hold fuzz; prediction machinery fills the gap plausibly. No concept of truth involved."},
 {t:2,q:"Pasting the source document into your prompt helps because…",o:["It retrains the model on your document","The context window is reliable working memory — open book beats memory","Longer prompts get more GPU time","It disables safety filters"],a:1,
  x:"Knowledge in context is directly attended to; knowledge in weights is vague recollection. This is also exactly why RAG works."},
 {t:2,q:"'Think step by step' works because…",o:["It's a politeness ritual the model rewards","Compute per emitted token is fixed, so more tokens = more total computation","It triggers a hidden reasoning mode switch","It doesn't — it's superstition"],a:1,
  x:"Each token is a shallow step; the chain adds up to real computation. Forcing an instant verdict starves the model of compute."},
 {t:2,q:"A model aces PhD physics questions. What does that tell you about its arithmetic on 9.11 vs 9.9?",o:["It will be at least as good","Almost nothing — capability is jagged","It will be slightly worse","Arithmetic is always perfect in LLMs"],a:1,
  x:"Jagged intelligence: Swiss-cheese capability. Calibrate trust per task-type, never per model."},
 // tier 3 — transfer
 {t:3,q:"Why does RL-with-verification work brilliantly for code and maths but not for essays?",o:["Essays are longer than code","Code and maths answers can be checked automatically, giving a reliable reward signal","Models weren't pretrained on essays","RL only works on numbers"],a:1,
  x:"RL needs a trustworthy 'was that good?' signal at scale. Tests and known answers give it; taste doesn't — that's why essays get RLHF (a learned preference model) instead."},
 {t:3,q:"Claude enthusiastically agrees with your essay's argument. The mechanical reading is…",o:["The argument is strong","Agreement was the preferred-looking output — RLHF optimises preferred, not true","The model checked it against sources","The model is being polite but secretly disagrees"],a:1,
  x:"Sycophancy falls out of optimising a human-preference reward model. Verify against docs/tests/runs — never against confidence or agreement."},
 {t:3,q:"Your teammate vibe-codes a feature in a framework nobody on the team knows. Kernighan's Law says the real risk is…",o:["The code will be slow","Licensing problems","Debugging is twice as hard as writing — the code sits beyond anyone's comprehension budget","The AI will remember the code"],a:2,
  x:"Code at the edge of (someone's) writing ability is beyond their debugging ability. Unreviewed + unfamiliar = undebuggable by the team."},
 {t:3,q:"A RAG chatbot over your notes still occasionally invents facts. Which fix attacks the actual mechanism?",o:["A bigger model","Retrieval + 'answer ONLY from the pasted sources, else say you don't know' + show quotes","A system prompt saying 'do not hallucinate'","Lower temperature to zero"],a:1,
  x:"Ground the answer in context (reliable memory), constrain the style that fills gaps, and make claims checkable. Magic words and knob-twiddling don't touch the mechanism."},
];
let qi=0, qscore=0, misses=[];
const qhost=document.getElementById("qhost"), qbar=document.getElementById("qbar");
const TIER={1:["t1","Warm-up"],2:["t2","Mechanisms"],3:["t3","Transfer"]};
function renderQ(){
  qbar.style.width=(qi/QS.length*100)+"%";
  if(qi>=QS.length){ return renderDone(); }
  const q=QS[qi], [tc,tn]=TIER[q.t];
  qhost.innerHTML=`<div class="qmeta"><span>Question ${qi+1} / ${QS.length}</span>
    <span class="tier ${tc}">Tier ${q.t} · ${tn}</span></div>
    <div class="q">${q.q}</div><div class="opts" id="opts"></div><div id="ex"></div>`;
  const opts=document.getElementById("opts");
  q.o.forEach((o,i)=>{ const b=document.createElement("button"); b.textContent=o;
    b.onclick=()=>answer(i,b); opts.appendChild(b); });
}
function answer(i,btn){
  const q=QS[qi], opts=[...document.getElementById("opts").children];
  opts.forEach(b=>b.disabled=true);
  opts[q.a].classList.add("right");
  if(i===q.a){ qscore++; } else { btn.classList.add("wrong"); misses.push(qi); }
  document.getElementById("ex").innerHTML=
    `<div class="explain"><b>${i===q.a?"Right.":"Not quite."}</b> ${q.x}</div>
     <div class="nav"><button onclick="qi++;renderQ()">${qi+1>=QS.length?"See results":"Next →"}</button></div>`;
}
function renderDone(){
  qbar.style.width="100%";
  const verdict = qscore>=10?"Clean — you own the canon. Do the project next."
    : qscore>=7?"Solid — patch the misses below, retry the tier-3 questions tomorrow."
    : "The ideas haven't stuck yet — re-read TEACH.md's 80/20 map and Part A, then retry.";
  qhost.innerHTML=`<div class="score">Score: ${qscore} / ${QS.length}</div><p>${verdict}</p>` +
   (misses.length?`<p><b>Review:</b></p><ul class="review">${misses.map(m=>`<li>Q${m+1}: ${QS[m].x}</li>`).join("")}</ul>`:"") +
   `<div class="nav"><button class="restart" onclick="qi=0;qscore=0;misses=[];renderQ()">Restart quiz</button></div>`;
}
function tab(which){
  document.getElementById("paneP").classList.toggle("hide", which!=="P");
  document.getElementById("paneQ").classList.toggle("hide", which!=="Q");
  document.getElementById("tabP").classList.toggle("on", which==="P");
  document.getElementById("tabQ").classList.toggle("on", which==="Q");
  if(which==="Q") renderQ();
}
</script>
</body>
</html>
